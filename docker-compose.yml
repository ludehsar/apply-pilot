name: apply-pilot

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apply_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apply_pilot}
      POSTGRES_DB: ${POSTGRES_DB:-apply_pilot}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    init: true
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-apply_pilot}:${POSTGRES_PASSWORD:-apply_pilot}@postgres:5432/${POSTGRES_DB:-apply_pilot}
      API_PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RUST_LOG: ${RUST_LOG:-api=info,tower_http=info}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres-data:
